spring:
  application:
    name: prodee
  main:
    lazy-initialization: true

  # ---------- Datasource ----------
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/prodee}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # ---------- JPA / Hibernate ----------
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  # ---------- Email ----------
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ---------- SQL seed data ----------
  sql:
    init:
      mode: always

# ---------- Prodee Custom Properties ----------
prodee:
  google:
    client-id: ${CLIENT_ID:}
  jwt:
    secret: ${JWT_SECRET:myVeryLongAndSecureJwtSecretKeyForProdeeApplicationThatIsAtLeast256BitsLongAndSecure2024}
    expiration-ms: 86400000 # 24 hours
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
    api-key: ${CLOUDINARY_API_KEY:demo}
    api-secret: ${CLOUDINARY_API_SECRET:demo}
  devto:
    api-url: https://dev.to/api/articles

# ---------- Server ----------
server:
  port: ${PORT:8080}

# ---------- Swagger / OpenAPI ----------
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
